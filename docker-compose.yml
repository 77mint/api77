services:
  my-proxy-hub:
    build: .
    container_name: my-proxy-hub
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATA_DIR=/app/data
      # 首次启动时的默认面板密码（启动后可在网页「设置」里修改）
      - ADMIN_PASSWORD=change_me_123456
