services:
  my-proxy-hub:
    build: .
    container_name: my-proxy-hub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HUB_ADMIN_PASSWORD=${HUB_ADMIN_PASSWORD:-Mint77Hub#2026}
      - QUICK_BRIDGE_URL=http://quick-bridge:3426
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - quick-bridge

  quick-bridge:
    image: node:22-alpine
    container_name: quick-bridge
    restart: unless-stopped
    command: ["node", "/app/quick_bridge.mjs"]
    environment:
      - PORT=3426
      - HOST=0.0.0.0
      - UPSTREAM_DIR=/app/upstream
      - QUICK_DATA_DIR=/data
    volumes:
      - ../magpie-aws-quick:/app/upstream:ro
      - ./quick_bridge.mjs:/app/quick_bridge.mjs:ro
      - ./quick-data:/data
